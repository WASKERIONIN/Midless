name: Build Windows Release

on:
  push:
    branches: [ "arena/01a08553-midless" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 + MinGW + Raylib
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-raylib
          mingw-w64-x86_64-enet
          git
          zip
          p7zip

    - name: Download single-file dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        # FastNoiseLite
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Auburn/FastNoiseLite/master/C/FastNoiseLite.h" -OutFile "libs/FastNoiseLite.h" -UseBasicParsing
        # stb_ds
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_ds.h" -OutFile "libs/stb_ds.h" -UseBasicParsing
        # minilua
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/edubart/minilua/master/minilua.h" -OutFile "libs/minilua.h" -UseBasicParsing
        # enet wrapper (MSYS2 installs to enet/enet.h, code uses enet.h)
        Set-Content -Path "libs/enet.h" -Value '#include <enet/enet.h>'
        # Download glad.h for rlgl.h (raylib's external/ dir)
        New-Item -ItemType Directory -Force -Path "libs/external" | Out-Null
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/raysan5/raylib/4.5.0/src/external/glad.h" -OutFile "libs/external/glad.h" -UseBasicParsing
        Write-Host "Dependencies downloaded:"
        Get-ChildItem libs/ -Recurse | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }

    - name: Build with custom script
      run: |
        set -ex
        export PATH="/mingw64/bin:$PATH"
        bash build_cosmic.sh 2>&1

    - name: Package release
      run: |
        set -ex
        OUT="release/Midless-Cosmic-Windows-x64"
        mkdir -p "$OUT/textures" "$OUT/mods"

        cp build/client/game.exe "$OUT/game.exe"
        cp build/server/server.exe "$OUT/server.exe"

        # Copy raylib DLL
        for dll in /mingw64/bin/libraylib*.dll; do
          [ -f "$dll" ] && cp "$dll" "$OUT/" && echo "Copied DLL: $dll"
        done

        cp build/client/textures/*.png "$OUT/textures/"
        cp build/client/mods/*.lua "$OUT/mods/"

        cat > "$OUT/README.txt" << 'README'
        === Midless: Cosmic Edition ===

        A voxel game set among floating islands in a starlit void.

        CONTROLS:
          WASD - Move | Space - Jump | Left Click - Break block
          Right Click - Place block | Mouse Wheel - Select block
          T - Chat | ESC - Menu | F3 - Debug | F5 - Camera view

        Launch game.exe for singleplayer, server.exe for dedicated server.
        Choose "New World" to generate cosmic terrain.
        README

        echo "=== Package contents ==="
        find "$OUT" -type f -ls

        cd release
        7z a -tzip Midless-Cosmic-Windows-x64.zip Midless-Cosmic-Windows-x64/
        sha256sum Midless-Cosmic-Windows-x64.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midless-Cosmic-Windows-x64
        path: release/Midless-Cosmic-Windows-x64.zip
        if-no-files-found: error

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        TAG="cosmic-v$(date +%Y%m%d%H%M%S)"
        gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "Midless: Cosmic Edition" \
          --notes "## Midless: Cosmic Edition

        Floating islands drifting through a starlit void.

        - Space background with procedural starfield and nebula bands
        - Floating islands with organic shapes and crystal pools
        - Asteroids replacing clouds
        - Cosmic shaders with violet nebula fog
        - Water contained in crystal pools only
        - Water wall bug fixed

        Download, extract, run game.exe. Start a New World." \
          release/Midless-Cosmic-Windows-x64.zip \
          release/SHA256SUMS
