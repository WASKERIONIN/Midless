name: Build Windows Release

on:
  push:
    branches: [ "arena/01a08553-midless" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 + MinGW + Raylib
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-raylib
          git
          zip
          p7zip

    - name: Verify raylib installation
      run: |
        echo "Checking raylib headers and library..."
        ls /mingw64/include/raylib.h
        ls /mingw64/lib/libraylib.a 2>/dev/null || ls /mingw64/lib/libraylib* 2>/dev/null || echo "No static lib, checking shared..."
        find /mingw64/lib -name "*raylib*" 2>/dev/null
        find /mingw64/include -name "raylib*" -o -name "rlgl*" -o -name "raymath*" 2>/dev/null

    - name: Build client (game.exe)
      run: |
        export PATH="/mingw64/bin:$PATH"
        LOG=build.log
        echo "=== Testing asteroid.c ===" > "$LOG"
        gcc -Wall -std=c99 -D_DEFAULT_SOURCE -Wno-missing-braces \
          -DPLATFORM_DESKTOP -DOS_WINDOWS \
          -I./client/src -I./client/src/chunk -I./client/src/block \
          -I./client/src/entity -I./client/src/gui -I./client/src/networking \
          -I./server/src -I./server/src/world -I./server/src/world/chunk \
          -I./server/src/scripting -I./libs -I./shared \
          -I/mingw64/include \
          -c client/src/asteroid.c -o /tmp/asteroid.o >> "$LOG" 2>&1 || true
        echo "=== Testing starfield.c ===" >> "$LOG"
        gcc -Wall -std=c99 -D_DEFAULT_SOURCE -Wno-missing-braces \
          -DPLATFORM_DESKTOP -DOS_WINDOWS \
          -I./client/src -I./client/src/chunk -I./client/src/block \
          -I./client/src/entity -I./client/src/gui -I./client/src/networking \
          -I./server/src -I./server/src/world -I./server/src/world/chunk \
          -I./server/src/scripting -I./libs -I./shared \
          -I/mingw64/include \
          -c client/src/starfield.c -o /tmp/starfield.o >> "$LOG" 2>&1 || true
        echo "=== Testing main.c ===" >> "$LOG"
        gcc -Wall -std=c99 -D_DEFAULT_SOURCE -Wno-missing-braces \
          -DPLATFORM_DESKTOP -DOS_WINDOWS \
          -I./client/src -I./client/src/chunk -I./client/src/block \
          -I./client/src/entity -I./client/src/gui -I./client/src/networking \
          -I./server/src -I./server/src/world -I./server/src/world/chunk \
          -I./server/src/scripting -I./libs -I./shared \
          -I/mingw64/include \
          -c client/src/main.c -o /tmp/main.o >> "$LOG" 2>&1 || true
        echo "=== Full build ===" >> "$LOG"
        mingw32-make \
          RAYLIB_PATH=/mingw64 \
          RAYLIB_INCLUDE_DIR=/mingw64/include \
          RAYLIB_LIB_DIR=/mingw64/lib \
          -j1 >> "$LOG" 2>&1 || true
        cat "$LOG"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Build server (server.exe)
      run: |
        export PATH="/mingw64/bin:$PATH"
        mingw32-make BUILD_SERVER=TRUE \
          RAYLIB_PATH=/mingw64 \
          RAYLIB_INCLUDE_DIR=/mingw64/include \
          RAYLIB_LIB_DIR=/mingw64/lib \
          -j$(nproc) 2>&1 >> build.log || true
        tail -30 build.log

    - name: Package release
      run: |
        set -x
        OUT="release/Midless-Cosmic-Windows-x64"
        mkdir -p "$OUT/textures" "$OUT/mods"
        echo "=== Searching for build outputs ==="
        find build/ -type f 2>/dev/null | head -30
        for f in build/client/game build/client/game.exe; do
          [ -f "$f" ] && cp "$f" "$OUT/game.exe" && echo "Copied $f -> game.exe" && break
        done
        for f in build/server/server build/server/server.exe; do
          [ -f "$f" ] && cp "$f" "$OUT/server.exe" && echo "Copied $f -> server.exe" && break
        done
        cp build/client/textures/*.png "$OUT/textures/" 2>/dev/null || true
        cp build/client/mods/*.lua "$OUT/mods/" 2>/dev/null || true
        cat > "$OUT/README.txt" << 'README'
        === Midless: Cosmic Edition ===
        
        A voxel game set among floating islands in a starlit void.
        
        CONTROLS:
          WASD - Move | Space - Jump | Left Click - Break block
          Right Click - Place block | Mouse Wheel - Select block
          T - Chat | ESC - Menu | F3 - Debug | F5 - Camera view
        
        Launch game.exe for singleplayer, server.exe for dedicated server.
        Choose "New World" to generate cosmic terrain.
        README
        cd release
        7z a -tzip Midless-Cosmic-Windows-x64.zip Midless-Cosmic-Windows-x64/
        sha256sum Midless-Cosmic-Windows-x64.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midless-Cosmic-Windows-x64
        path: release/Midless-Cosmic-Windows-x64.zip
        if-no-files-found: error

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        TAG="cosmic-v$(date +%Y%m%d%H%M%S)"
        gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "Midless: Cosmic Edition" \
          --notes "## Midless: Cosmic Edition

        Floating islands drifting through a starlit void.

        - Space background with procedural starfield and nebula bands
        - Floating islands with organic shapes and crystal pools
        - Asteroids replacing clouds
        - Cosmic shaders with violet nebula fog
        - Water contained in crystal pools only
        - Water wall bug fixed

        Download, extract, run game.exe. Start a New World." \
          release/Midless-Cosmic-Windows-x64.zip \
          release/SHA256SUMS
