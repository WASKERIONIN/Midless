name: Build Windows Release

on:
  push:
    branches: [ "arena/01a0872c-midless", "arena/01a096b7-midless" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 + MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          git
          zip
          p7zip

    - name: Build raylib 4.5 from source (pinned API)
      shell: msys2 {0}
      run: |
        set -ex
        cd /d/a
        if [ ! -f /d/a/raylib45/src/libraylib.a ]; then
          git clone --depth 1 --branch 4.5.0 https://github.com/raysan5/raylib.git raylib45
          cd raylib45/src
          mingw32-make PLATFORM=PLATFORM_DESKTOP -j4 > build.log 2>&1 || { tail -50 build.log; exit 1; }
        fi
        ls -la /d/a/raylib45/src/libraylib.a

    - name: Download single-file dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Auburn/FastNoiseLite/master/C/FastNoiseLite.h" -OutFile "libs/FastNoiseLite.h" -UseBasicParsing
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nothings/stb/master/stb_ds.h" -OutFile "libs/stb_ds.h" -UseBasicParsing
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/edubart/minilua/master/minilua.h" -OutFile "libs/minilua.h" -UseBasicParsing
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/raysan5/raygui/4.0/src/raygui.h" -OutFile "libs/raygui.h" -UseBasicParsing
        New-Item -ItemType Directory -Force -Path "libs/external" | Out-Null
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/raysan5/raylib/4.5.0/src/external/glad.h" -OutFile "libs/external/glad.h" -UseBasicParsing
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/zpl-c/enet/master/include/enet.h" -OutFile "libs/enet.h" -UseBasicParsing
        Get-ChildItem libs/ -Recurse -File | ForEach-Object { Write-Host $_.FullName }

    - name: Build
      run: |
        set -ex
        export PATH="/mingw64/bin:$PATH"
        export RAYLIB_SRC="/d/a/raylib45/src"
        bash build_cosmic.sh 2>&1

    - name: Package release
      run: |
        set -ex
        OUT="release/Midless-Cosmic-Windows-x64"
        mkdir -p "$OUT/textures" "$OUT/mods"

        cp build/client/game.exe "$OUT/game.exe"
        cp build/server/server.exe "$OUT/server.exe"

        # static-ish binary; bundle runtime DLLs if any are needed
        objdump -p build/client/game.exe 2>/dev/null | grep "DLL Name" | while read _ _ name; do
          for searchdir in /mingw64/bin /d/a/raylib45/src /usr/bin; do
            if [ -f "$searchdir/$name" ] && [ ! -f "$OUT/$name" ]; then
              cp "$searchdir/$name" "$OUT/" && echo "  $name"
            fi
          done
        done
        # usually needed: winpthread
        for dll in /mingw64/bin/libwinpthread-1.dll /mingw64/bin/libgcc_s_seh-1.dll; do
          [ -f "$dll" ] && cp "$dll" "$OUT/" && echo "  $(basename $dll)"
        done

        mkdir -p "$OUT/fonts"
        cp client/fonts/*.ttf "$OUT/fonts/"
        if [ -d client/textures ]; then
          cp client/textures/*.png "$OUT/textures/"
        fi
        cp build/client/textures/*.png "$OUT/textures/"
        cp mods/*.lua "$OUT/mods/"
        cp docs/RELEASE_README.txt "$OUT/README.txt"

        echo "=== Package contents ==="
        find "$OUT" -type f -ls

        cd release
        7z a -tzip Midless-Cosmic-Windows-x64.zip Midless-Cosmic-Windows-x64/
        sha256sum Midless-Cosmic-Windows-x64.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Midless-Cosmic-Windows-x64
        path: release/Midless-Cosmic-Windows-x64.zip
        if-no-files-found: error

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -ex
        TAG="cosmic-v$(date +%Y%m%d%H%M%S)"
        gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "Midless: Cosmic Edition v60.1" \
          --notes-file docs/RELEASE_NOTES.md \
          release/Midless-Cosmic-Windows-x64.zip \
          release/SHA256SUMS
